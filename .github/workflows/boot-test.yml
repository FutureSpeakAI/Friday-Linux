# Friday Linux — SPEC.md §16.2, M0 acceptance checklist (§15).
#
# ROOT CAUSE FOUND 2026-08-30 for the long-standing "workflow file issue /
# zero jobs" failure (docs/VERIFY.md had it as an open, unexplained quirk
# blamed on workflow_run timing): this file's earlier draft had several
# single-line `run: echo "TODO: curl http://...:3000/api/health, poll for
# boot_critical_ok"` steps. YAML treats an unquoted-at-the-mapping-level
# scalar's "TODO:" (colon immediately followed by a space) as a NESTED
# mapping key inside what is supposed to be a plain scalar value — genuinely
# invalid YAML, not a GitHub bug. Confirmed by parsing the actual committed
# blob with PyYAML: "mapping values are not allowed here, line 38 column
# 24". GitHub silently registers a zero-job failed run tagged with whatever
# event caused it to re-parse the file (a push, here) when a workflow file
# fails to parse, which is exactly the symptom docs/VERIFY.md described.
# Every multi-word `run:` value below is now either single-quoted or a `|`
# block scalar, and this file's own YAML was validated locally with PyYAML
# before being pushed. The trigger (workflow_run) was NOT the cause and was
# never the problem — it is dropped below anyway, in favor of manual
# workflow_dispatch, purely to avoid doubling CI cost on every push while
# this workflow's own steps are still being iterated on (see the `on:`
# block comment).
#
# DESIGN: rather than rebuilding the whole image again here (podman build
# + the llama.cpp compile already takes ~20-50 minutes in build.yml), this
# job PULLS the image build.yml already pushed to
# ghcr.io/futurespeakai/friday-linux:testing and only re-runs
# bootc-image-builder (a few minutes) to get a raw disk to boot. That keeps
# each iteration of THIS file's own logic cheap.
name: boot-test

on:
  # Deliberately workflow_dispatch only, not an automatic chain off `build`
  # (via workflow_run or push): while this file's QEMU/OVMF/ESP-injection
  # logic is still being iterated on, chaining would re-run a multi-minute
  # job after every single push to main, including doc-only commits that
  # do not change the image at all. Revisit once this file is stable
  # (SPEC.md §16.2 does not mandate automatic chaining, only that the test
  # exists and runs in CI).
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Image to pull and boot-test'
        required: false
        default: 'ghcr.io/futurespeakai/friday-linux:testing'

jobs:
  boot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        # CI run 33339218662's real failure: bootc-image-builder's ostree
        # pull died with "no space left on device" writing to
        # /var/tmp/container_images_*. build.yml already needed this exact
        # fix (docs/DECISIONS.md D-A6) for the same reason — a ~14 GiB-free
        # default runner, most of it pre-committed to toolchains this repo
        # never uses, cannot also hold a pulled ~2.2 GB image, a ~17.5 GiB
        # raw disk file, qemu/OVMF packages, and osbuild's own scratch
        # space. This step was missing from boot-test.yml entirely (it
        # only existed in build.yml) — copied over rather than re-derived,
        # since it is proven to work there.
        run: |
          echo "before:" && df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache /usr/local/lib/android \
            /opt/az /usr/lib/jvm || true
          echo "after:" && df -h /

      - name: Confirm KVM is available
        # SPEC.md §16.2 asserts GitHub-hosted ubuntu-latest runners expose
        # KVM. docs/VERIFY.md flagged this as historically true but worth a
        # fresh smoke-test rather than trusted from the spec text alone.
        run: |
          ls -la /dev/kvm
          [ -r /dev/kvm ] && [ -w /dev/kvm ]
          echo "KVM device present and read/write accessible to this runner."

      - name: Install QEMU, OVMF, and gdisk on the runner
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf gdisk
          echo "--- OVMF firmware files actually installed ---"
          dpkg -L ovmf | grep -i '\.fd$' || true

      - name: Pull the built image into root's podman storage
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "${{ github.event.inputs.image_ref }}"

      - name: Produce raw image (bootc-image-builder, same disk.toml as build.yml)
        run: |
          mkdir -p output
          sudo podman run --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/build/disk.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type raw \
            --rootfs xfs \
            "${{ github.event.inputs.image_ref }}"
          find output -type f
          # CI run 33339485078's real failure: bootc-image-builder actually
          # succeeded ("Build complete!") but this step still failed,
          # because the raw file lands at output/image/disk.raw (a
          # subdirectory), not directly under output/ — the plain glob
          # `output/*.raw` matched nothing, and `chmod` on a literal,
          # non-existent "output/*.raw" exits nonzero under `bash -e`,
          # failing the whole step despite the real work having succeeded.
          # `find` (already used correctly in the next step) is recursive;
          # this chmod now matches it.
          sudo find output -name '*.raw' -exec chmod 666 {} \;

      - name: Grow the disk so the lockbox has real free space to claim
        # SPEC.md §5/ADR-004: the lockbox is created at first boot on
        # whatever free space exists on the boot device beyond the shipped
        # image's own partitions (see build/disk.toml's header for why
        # bootc-image-builder itself has no "leave N GiB free" primitive).
        # +4G here is an arbitrary CI-only choice, large enough to hold a
        # small btrfs+LUKS2 lockbox with real headroom, small enough not to
        # meaningfully slow the boot test down.
        run: |
          RAW="$(find output -name '*.raw' | head -1)"
          echo "raw=${RAW}" >> "$GITHUB_ENV"
          qemu-img resize -f raw "${RAW}" +4G
          # sgdisk -e relocates the GPT backup header/table to the new end
          # of the file — required after growing a raw GPT disk image, or
          # tools see a corrupt-looking backup header at the old (now
          # wrong) end-of-disk location instead of real trailing free space.
          sudo sgdisk -e "${RAW}"
          sudo sgdisk -p "${RAW}"

      - name: Inject friday-unattended.yaml into the ESP partition
        # SPEC.md §7.6. Partition numbering confirmed from the real
        # bootc-image-builder output captured in build.yml's own CI log
        # (CI run 33328948151): p1 is the BIOS-boot partition (GPT type
        # 21686148-...), p2 is the ESP (type C12A7328-...), p3 is /boot,
        # p4 is /. Loop-mounting p2 directly rather than guessing p1.
        run: |
          LOOP="$(sudo losetup -fP --show "${raw}")"
          echo "loop=${LOOP}" >> "$GITHUB_ENV"
          sudo partprobe "${LOOP}" || sudo blockdev --rereadpt "${LOOP}" || true
          sleep 1
          sudo mkdir -p /mnt/esp
          sudo mount "${LOOP}p2" /mnt/esp
          cat <<'YAML' | sudo tee /mnt/esp/friday-unattended.yaml > /dev/null
          lockbox:
            passphrase: "friday-linux-ci-boot-test-passphrase-not-a-real-secret"
          YAML
          ls -la /mnt/esp/
          sudo umount /mnt/esp
          sudo losetup -d "${LOOP}"

      - name: Boot under QEMU/KVM with OVMF
        # SPEC.md §16.2: 8 GB RAM, OVMF, hostfwd for /api/health. The
        # hostfwd target is guest port 3001 (friday-boot-test-relay.service),
        # not 3000 — see that unit's header comment for why a plain hostfwd
        # cannot reach a service bound to 127.0.0.1 inside the guest.
        run: |
          OVMF_CODE="$(dpkg -L ovmf | grep -m1 'OVMF_CODE\.fd$')"
          OVMF_VARS_SRC="$(dpkg -L ovmf | grep -m1 'OVMF_VARS\.fd$')"
          cp "${OVMF_VARS_SRC}" /tmp/OVMF_VARS.fd
          echo "ovmf_code=${OVMF_CODE}" >> "$GITHUB_ENV"
          sudo qemu-system-x86_64 \
            -M q35 -accel kvm -cpu host -smp 2 -m 8192 \
            -drive if=pflash,format=raw,readonly=on,file="${OVMF_CODE}" \
            -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
            -drive file="${raw}",format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::3000-:3001 \
            -device virtio-net-pci,netdev=net0 \
            -serial file:/tmp/console.log \
            -display none \
            -daemonize -pidfile /tmp/qemu.pid
          sleep 2
          echo "qemu pid: $(cat /tmp/qemu.pid)"

      - name: Wait for /api/health within 300s
        # Amendment A1 (SPEC.md): M0 accepts HTTP 200 alone; the
        # boot_critical_ok JSON field is a PR-6/M2 gate, not M0's.
        run: |
          DEADLINE=$((SECONDS + 300))
          until curl -fsS --max-time 3 -o /tmp/health.json http://127.0.0.1:3000/api/health; do
            if (( SECONDS > DEADLINE )); then
              echo "::error::/api/health did not return 2xx within 300s"
              exit 1
            fi
            sleep 5
          done
          echo "/api/health responded within ${SECONDS}s:"
          cat /tmp/health.json

      - name: Give the boot-test probe time to run, then shut down
        run: |
          sleep 20
          sudo qemu-system-x86_64 -version > /dev/null  # no-op sanity
          if [ -f /tmp/qemu.pid ] && kill -0 "$(cat /tmp/qemu.pid)" 2>/dev/null; then
            sudo kill "$(cat /tmp/qemu.pid)"
            sleep 3
          fi

      - name: Show the captured console log (bootc status, /usr write test)
        if: always()
        run: |
          echo "--- full console.log ---"
          sudo cat /tmp/console.log || echo "no console.log captured"
          echo "--- FRIDAY-BOOT-TEST-PROBE block only ---"
          sudo sed -n '/FRIDAY-BOOT-TEST-PROBE-BEGIN/,/FRIDAY-BOOT-TEST-PROBE-END/p' /tmp/console.log || true

      - name: Assert /usr is read-only, from the probe output
        run: |
          sudo grep -q 'USR_WRITABLE=no' /tmp/console.log

      - name: Upload console log as a CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-console-log
          path: /tmp/console.log
          retention-days: 14
