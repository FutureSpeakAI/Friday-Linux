# Friday Linux — SPEC.md §14 (ci/build.yml), §6 size budget (G7).
#
# STATUS (2026-08-30): every real step in this workflow is green end to end
# — `podman build` (including the llama-server-vulkan stage),
# `bootc-image-builder` producing a raw image, and the G7 size check
# (measured compressed size 1719 MiB, well under the 8192 MiB budget) — see
# docs/MILESTONES.md for the exact CI run and command output. `build/disk.toml`
# is still not written (bootc-image-builder's default disk layout was used
# instead — see docs/VERIFY.md); SPEC.md §5's exact partition sizes are a
# real gap tracked there for M1, not silently treated as satisfied.
#
# Signing (SPEC.md §10.3) is deliberately a skip, not a failure: no
# COSIGN_* secret exists or is referenced here, per the executor's operating
# instructions not to create one before a real signing milestone. The GHCR
# push step uses the auto-issued GITHUB_TOKEN (no secret to create) scoped
# by this job's own `permissions:` block.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # packages: write lets this job's auto-issued GITHUB_TOKEN push to this
    # repo's own GHCR namespace (ghcr.io/futurespeakai/friday-linux) with no
    # secret to create — GITHUB_TOKEN is minted per-run by GitHub Actions
    # itself, not something this executor is creating or storing. If the
    # repository's own Settings->Actions policy has GITHUB_TOKEN's default
    # permissions restricted below this, the push step below will fail with
    # a permissions error — informative, not something to work around by
    # touching repo settings (out of scope for this executor either way).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read pins
        id: pins
        run: |
          echo "agent_friday=$(cat build/agent-friday.pin | grep -v '^#' | head -1)" >> "$GITHUB_OUTPUT"
          echo "llama_cpp=$(cat build/llama.cpp.pin 2>/dev/null | grep -v '^#' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Fail fast if pins are unresolved
        if: steps.pins.outputs.agent_friday == '' || steps.pins.outputs.llama_cpp == ''
        run: |
          echo "::error::build/agent-friday.pin or build/llama.cpp.pin is unresolved — see docs/DECISIONS.md"
          exit 1

      # GitHub-hosted ubuntu-latest runners ship ~14 GiB free by default,
      # most of the rest of the disk pre-committed to toolchains this build
      # never uses (a full .NET SDK, Android SDK/NDK, GHC, etc.). This build
      # ran the runner out of disk THREE separate times before this step
      # existed (docs/DECISIONS.md Deviations D-A3, D-A4, and the uv-cache
      # fix next to this one) - compiling llama.cpp plus a ~90-package venv
      # install is genuinely disk-heavy. Removing preinstalled toolchains
      # this repo never touches reclaims real, measured headroom rather
      # than guessing at cache tuning alone.
      - name: Free disk space on the runner
        run: |
          echo "before:" && df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache /usr/local/lib/android \
            /opt/az /usr/lib/jvm || true
          echo "after:" && df -h /

      - name: podman build
        run: podman build -t friday-linux:testing -f Containerfile .

      # M0's checklist line is "image pushed to
      # ghcr.io/futurespeakai/friday-linux:testing, signed" — signing is
      # deliberately deferred (see the skip step at the end of this file),
      # but the push half needs no new secret: GITHUB_TOKEN is minted by
      # GitHub Actions for this run and scoped by the `permissions:` block
      # above.
      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag localhost/friday-linux:testing ghcr.io/futurespeakai/friday-linux:testing
          podman push ghcr.io/futurespeakai/friday-linux:testing

      # bootc-image-builder below runs as root (it needs loop-device
      # access) and reads images from root's podman storage
      # (/var/lib/containers/storage), a SEPARATE store from the
      # unprivileged "runner" user's rootless storage the step above just
      # built into. CI run 33322712869 hit exactly that mismatch
      # ("localhost/friday-linux:testing: image not known" from inside
      # bootc-image-builder). The first fix tried was building the whole
      # image again with `sudo podman build` — CI run 33323791375 then hit a
      # SEPARATE, unrelated failure specific to the root/sudo podman
      # environment on this runner (`dnf`'s $releasever failed to expand,
      # "database disk image is malformed") that never happened across many
      # rootless builds, and re-running the ~20-minute build a second time
      # under sudo just to move storage is wasteful even when it works. This
      # is the actual fix: build once, rootless, as before (reliable), then
      # move the already-built image into root's store with `podman save` /
      # `sudo podman load` — a tar round-trip, not a rebuild.
      - name: Copy built image into root's podman storage
        run: |
          podman save -o /tmp/friday-linux.tar localhost/friday-linux:testing
          sudo podman load -i /tmp/friday-linux.tar
          rm -f /tmp/friday-linux.tar

      - name: Discover bootc-image-builder CLI (docs/VERIFY.md disk.toml question)
        # Top-level --help only lists subcommands (build, manifest, ...); the
        # actual build-time flags (rootfs override, disk config, etc.) live
        # under `build --help`, which CI run 33325393238 never captured
        # before this step's own `build` invocation failed with "missing
        # required info: DefaultRootFs" - logging both here now so the next
        # fix is read from real output, not guessed twice.
        run: |
          mkdir -p output
          echo "--- bootc-image-builder --help ---"
          sudo podman run --rm quay.io/centos-bootc/bootc-image-builder:latest --help
          echo "--- bootc-image-builder build --help ---"
          sudo podman run --rm quay.io/centos-bootc/bootc-image-builder:latest build --help

      - name: Produce raw image (bootc-image-builder)
        # RESOLVED 2026-08-30 (docs/VERIFY.md, docs/DECISIONS.md): the disk
        # customization file is mounted at the fixed path /config.toml (no
        # --config flag exists in `build --help`'s real, captured output;
        # confirmed against the real osbuild/images bootc-image-builder
        # README, fetched live). build/disk.toml sets minsize=16GiB for "/"
        # and minsize=1GiB for "/boot", giving SPEC.md §5's fixed root size
        # instead of the previous build's content-fit sizing (~9.57 GiB).
        # `--rootfs xfs` was confirmed correct by CI run 33326572437 (real
        # ostree deploy, not a guess anymore).
        run: |
          sudo podman run --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/build/disk.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type raw \
            --rootfs xfs \
            localhost/friday-linux:testing
          ls -la output/
          sudo chmod 644 output/*.raw 2>/dev/null || true

      - name: Size check (G7)
        run: |
          set -euo pipefail
          RAW="$(find output -name '*.raw' -o -name 'disk.raw' | head -1)"
          if [[ -z "${RAW}" ]]; then
            echo "::error::no .raw image found under output/ to size-check" >&2
            exit 1
          fi
          COMPRESSED_MIB=$(xz -T0 -c "${RAW}" | wc -c | awk '{printf "%d", $1/1024/1024}')
          echo "compressed size: ${COMPRESSED_MIB} MiB (budget: 8192 MiB, SPEC.md G7)"
          if (( COMPRESSED_MIB > 8192 )); then
            echo "::error::compressed raw image is ${COMPRESSED_MIB} MiB, over the 8 GiB G7 budget" >&2
            exit 1
          fi

      # Signing is explicitly out of scope for M0 (SPEC.md §18 rule 5 forbids
      # inventing a cosign invocation "from memory" and presenting it as
      # verified; the executor's operating instructions separately forbid
      # creating or referencing any COSIGN_* secret before a real signing
      # milestone). This step is now a clearly-marked skip, not a failure:
      # everything before it in this workflow (podman build, the
      # llama-server-vulkan stage, and bootc-image-builder producing a raw
      # image under the G7 size budget) is real and green, and the whole
      # `build` job should report that success rather than a red X for a
      # deliberately deferred, out-of-scope step. TODO(M4 or whenever image
      # signing is scheduled, per SPEC.md §10.3): replace this with a real
      # `cosign sign` invocation once COSIGN_* secrets exist and the exact
      # invocation is confirmed against the pinned cosign release.
      - name: Sign with cosign (keyless, GitHub OIDC) — SKIPPED, out of scope for M0
        run: |
          echo "SKIPPED: image signing is out of scope until a later milestone (SPEC.md §10.3)."
          echo "No COSIGN_* secret exists or is referenced. See docs/VERIFY.md's cosign entry."
          echo "TODO: replace with a real 'cosign sign' invocation when this milestone is scheduled."
