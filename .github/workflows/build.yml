# Friday Linux — SPEC.md §14 (ci/build.yml), §6 size budget (G7).
#
# STATUS (2026-08-30): `podman build` succeeds (CI run 33320543663, image
# tagged localhost/friday-linux:testing, includes the llama-server-vulkan
# build stage). The `bootc-image-builder` step below is newly written this
# pass and not yet confirmed — its exact CLI invocation and whether
# --privileged/loop-device access work on a GitHub-hosted runner are this
# session's next real check, not assumed. It deliberately omits a custom
# `build/disk.toml` for now (see the step's own comment and docs/VERIFY.md)
# rather than guess a TOML schema this sandbox cannot verify.
#
# Needs GitHub Actions repo/org secrets not yet provisioned: COSIGN_*
# (SPEC.md §10.3) — not created here per the instruction not to touch
# GitHub remotes/secrets without telling Stephen first. The GHCR push step
# does not exist yet either (SPEC.md's M0 checklist line covers both
# push-and-sign together; push uses the built-in GITHUB_TOKEN, no secret to
# create, but is sequenced after the raw-image and size-check steps below
# actually work).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pins
        id: pins
        run: |
          echo "agent_friday=$(cat build/agent-friday.pin | grep -v '^#' | head -1)" >> "$GITHUB_OUTPUT"
          echo "llama_cpp=$(cat build/llama.cpp.pin 2>/dev/null | grep -v '^#' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Fail fast if pins are unresolved
        if: steps.pins.outputs.agent_friday == '' || steps.pins.outputs.llama_cpp == ''
        run: |
          echo "::error::build/agent-friday.pin or build/llama.cpp.pin is unresolved — see docs/DECISIONS.md"
          exit 1

      # GitHub-hosted ubuntu-latest runners ship ~14 GiB free by default,
      # most of the rest of the disk pre-committed to toolchains this build
      # never uses (a full .NET SDK, Android SDK/NDK, GHC, etc.). This build
      # ran the runner out of disk THREE separate times before this step
      # existed (docs/DECISIONS.md Deviations D-A3, D-A4, and the uv-cache
      # fix next to this one) - compiling llama.cpp plus a ~90-package venv
      # install is genuinely disk-heavy. Removing preinstalled toolchains
      # this repo never touches reclaims real, measured headroom rather
      # than guessing at cache tuning alone.
      - name: Free disk space on the runner
        run: |
          echo "before:" && df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache /usr/local/lib/android \
            /opt/az /usr/lib/jvm || true
          echo "after:" && df -h /

      - name: podman build
        run: podman build -t friday-linux:testing -f Containerfile .

      - name: Discover bootc-image-builder CLI (docs/VERIFY.md disk.toml question)
        run: |
          mkdir -p output
          echo "--- bootc-image-builder --help ---"
          podman run --rm quay.io/centos-bootc/bootc-image-builder:latest --help

      - name: Produce raw image (bootc-image-builder)
        # UNVERIFIED (docs/VERIFY.md): build/disk.toml's exact partition-
        # customization schema is not confirmed from this sandbox, so this
        # first pass deliberately omits --config and takes
        # bootc-image-builder's default disk layout for --type raw. That is
        # enough to satisfy M0's literal checklist line ("produces a raw
        # image <= 8 GB compressed") without guessing TOML syntax that the
        # previous --help step didn't confirm. SPEC.md Section 5's exact
        # partition sizes (16 GiB fixed root, remainder left free for the
        # lockbox) still need a verified build/disk.toml before M1, which
        # needs the lockbox to actually fit — tracked in docs/DECISIONS.md
        # and docs/VERIFY.md, not silently treated as done here.
        run: |
          sudo podman run --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type raw \
            --local \
            localhost/friday-linux:testing
          ls -la output/

      - name: Size check (G7)
        run: |
          set -euo pipefail
          RAW="$(find output -name '*.raw' -o -name 'disk.raw' | head -1)"
          if [[ -z "${RAW}" ]]; then
            echo "::error::no .raw image found under output/ to size-check" >&2
            exit 1
          fi
          COMPRESSED_MIB=$(xz -T0 -c "${RAW}" | wc -c | awk '{printf "%d", $1/1024/1024}')
          echo "compressed size: ${COMPRESSED_MIB} MiB (budget: 8192 MiB, SPEC.md G7)"
          if (( COMPRESSED_MIB > 8192 )); then
            echo "::error::compressed raw image is ${COMPRESSED_MIB} MiB, over the 8 GiB G7 budget" >&2
            exit 1
          fi

      - name: Sign with cosign (keyless, GitHub OIDC)
        run: |
          echo "UNVERIFIED (docs/VERIFY.md): exact cosign invocation not confirmed"
          exit 1  # deliberately fails until VERIFY.md's cosign question is answered
