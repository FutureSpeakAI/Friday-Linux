<!-- Friday Linux — SPEC.md §7.1 step 4. Polls /api/health and navigates to
     the app once boot_critical_ok is true. Shows real subsystem status from
     the health payload, never a fake progress bar, per the spec's wording.
     Contract (subsystems object) comes from Agent-Friday PR-6, not yet
     merged (docs/DECISIONS.md) — this page degrades to "waiting..." for any
     subsystem it doesn't recognize rather than assuming the final shape. -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Friday</title>
<style>
  body { background: #0a0a0a; color: #e5e5e5; font-family: system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  #status { text-align: center; }
  ul { list-style: none; padding: 0; text-align: left; display: inline-block; }
  li::before { content: "⏳ "; }
  li.ok::before { content: "✓ "; color: #4ade80; }
  li.failed::before { content: "✗ "; color: #f87171; }
</style>
</head>
<body>
<div id="status">
  <h1>Friday is waking up</h1>
  <ul id="subsystems"><li>Contacting the health endpoint…</li></ul>
</div>
<script>
async function poll() {
  try {
    const r = await fetch("/api/health", { cache: "no-store" });
    const body = await r.json();
    const ul = document.getElementById("subsystems");
    ul.innerHTML = "";
    for (const [name, info] of Object.entries(body.subsystems || {})) {
      const li = document.createElement("li");
      li.className = info.ok ? "ok" : "failed";
      li.textContent = `${name}: ${info.detail || (info.ok ? "ready" : "waiting")}`;
      ul.appendChild(li);
    }
    if (body.boot_critical_ok) {
      window.location.href = "/";
      return;
    }
  } catch (e) {
    // /api/health not up yet — normal early in boot, keep polling.
  }
  setTimeout(poll, 1000);
}
poll();
</script>
</body>
</html>
